# nginx-Konfiguration für den Bildkatalog (statische SPA).
# Cloud Run erwartet Port 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Content-Security-Policy: Hosts an die eigene Umgebung anpassen (Sharedien-API und -Bilder,
  # Matomo, Kartenkacheln). Das Inline-Script in index.html (Farbschema vor dem ersten Paint)
  # benötigt 'unsafe-inline' oder einen Hash.
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://library-ethz.opsone-analytics.ch; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; font-src 'self'; form-action 'self' https:; frame-src 'self' https:" always;

  # Gehashte Build-Dateien: dauerhaft cachen.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Laufzeit-Konfiguration und Einstieg nie cachen.
  location /config/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA-Fallback: saubere URLs wie /suche oder /bild/<id> liefern index.html aus.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
