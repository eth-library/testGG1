# nginx-Konfiguration für den Bildkatalog (statische SPA).
# Cloud Run erwartet Port 8080.

# Cache-Steuerung per map statt add_header in location-Blöcken: Ein add_header in einer location
# würde die Sicherheits-Header der server-Ebene nicht mehr erben.
map $uri $ep_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Alle Header nur hier setzen (keine add_header in den location-Blöcken), damit sie überall gelten.
  add_header Cache-Control $ep_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Content-Security-Policy: Hosts an die eigene Umgebung anpassen (Sharedien-API und -Bilder,
  # Matomo, Kartenkacheln). Das Inline-Script in index.html (Farbschema vor dem ersten Paint)
  # benötigt 'unsafe-inline' oder einen Hash.
  # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://library-ethz.opsone-analytics.ch; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; font-src 'self'; form-action 'self' https:; frame-src 'self' https:" always;

  # Gehashte Build-Dateien: dauerhaft cachen (siehe map oben).
  location /assets/ {
    try_files $uri =404;
  }

  # Laufzeit-Konfiguration nie cachen (map: no-cache).
  location /config/ {
    try_files $uri =404;
  }

  # SPA-Fallback: saubere URLs wie /suche oder /bild/<id> liefern index.html aus (no-cache).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
