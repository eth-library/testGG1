name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint und Format
        run: npm run lint
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Build (inkl. Kontrastprüfung der Themes)
        run: npm run build
      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests (Demo-Modus)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
